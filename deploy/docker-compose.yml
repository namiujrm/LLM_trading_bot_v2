services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: trading_timescaledb_pgvector
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_bot_db}
    volumes:
      - tsdb_data:/home/postgres/pgdata/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading_bot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trading_net

  redis:
    image: redis:7-alpine
    container_name: trading_redis_governor
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - trading_net

  ninerouter:
    image: node:22-alpine
    container_name: trading_9router_gateway
    restart: unless-stopped
    working_dir: /app
    environment:
      INITIAL_PASSWORD: "123456"
    command: ["sh", "-c", "npm install -g 9router@latest && 9router -p 20128 -H 0.0.0.0 -n --skip-update"]
    ports:
      - "${NINEROUTER_PORT:-20128}:20128"
    volumes:
      - ninerouter_config:/root/.9router
    networks:
      - trading_net

  trading-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: llm_trading_bot_v2_core
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: trading_timescaledb_pgvector
      POSTGRES_PORT: 5432
      REDIS_HOST: trading_redis_governor
      REDIS_PORT: 6379
      NINEROUTER_BASE_URL: http://trading_9router_gateway:20128/v1
      EXECUTION_MODE: ${EXECUTION_MODE:-TESTNET}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ninerouter:
        condition: service_started
    volumes:
      - logs:/app/logs
      - ../data:/app/data
      - reports:/app/reports
      - ../models:/app/models
    networks:
      - trading_net

volumes:
  tsdb_data:
  redis_data:
  ninerouter_config:
  logs:
  reports:

networks:
  trading_net:
    name: trading_net
