[project]
name = "trading-bot"
version = "0.1.0"
description = "Quant-LLM Multi-Agent Crypto Trading System with Causal GBDT, 9router & 2-Tier Episodic Memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "asyncpg>=0.32.0",
    "lightgbm>=4.5.0",
    "numba>=0.68.1",
    "numpy>=2.4.6",
    "polars>=2.0.0,<2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "redis>=8.1.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "import-linter>=2.1",
    "hypothesis>=6.115.0",
    "asyncpg-stubs>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

# =====================================================================
# 1. RUFF LINTER & FORMATTER CONFIGURATION
# =====================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = ["E501", "SIM108", "SIM401"]

# =====================================================================
# 2. PYRIGHT STATIC TYPE CHECKING (STRICT MODE)
# =====================================================================
[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true

# =====================================================================
# 3. PYTEST CONFIGURATION
# =====================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# =====================================================================
# 4. IMPORT-LINTER CONTRACTS (CLEAN ARCHITECTURE BOUNDARIES)
# =====================================================================
[tool.importlinter]
root_packages = ["trading_bot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain_is_pure"
type = "forbidden"
source_modules = ["trading_bot.domain"]
forbidden_modules = [
    "trading_bot.ports",
    "trading_bot.application",
    "trading_bot.adapters",
    "trading_bot.infrastructure",
    "trading_bot.interfaces",
]

[[tool.importlinter.contracts]]
name = "ports_depend_only_on_domain"
type = "forbidden"
source_modules = ["trading_bot.ports"]
forbidden_modules = [
    "trading_bot.application",
    "trading_bot.adapters",
    "trading_bot.infrastructure",
    "trading_bot.interfaces",
]

[[tool.importlinter.contracts]]
name = "application_depends_only_on_domain_and_ports"
type = "forbidden"
source_modules = ["trading_bot.application"]
forbidden_modules = [
    "trading_bot.adapters",
    "trading_bot.infrastructure",
    "trading_bot.interfaces",
]

[[tool.importlinter.contracts]]
name = "adapters_isolation"
type = "independence"
modules = [
    "trading_bot.adapters.persistence",
    "trading_bot.adapters.binance",
    "trading_bot.adapters.telegram",
    "trading_bot.adapters.quant_engine",
    "trading_bot.adapters.ml_engine",
]
